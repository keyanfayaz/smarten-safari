[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "safari-tabs-lab"
version = "0.4.1"
description = "Lightweight, read-only experiments for querying Safari windows, tab groups, and iCloud tabs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
safari-tabs = "safari_tabs.cli:main"
safari-tabs-mcp = "safari_tabs.mcp:main"

[tool.setuptools.packages.find]
include = ["safari_tabs*"]

[tool.setuptools.package-data]
"safari_tabs.adapters" = ["windows.js"]
