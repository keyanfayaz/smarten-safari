[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smarten-safari"
version = "0.4.2"
description = "Smarten for Safari: read-only access to Safari windows, tab groups, and iCloud tabs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
smarten-safari = "safari_tabs.cli:main"
smarten-safari-mcp = "safari_tabs.mcp:main"
safari-tabs = "safari_tabs.cli:main"
safari-tabs-mcp = "safari_tabs.mcp:main"

[tool.setuptools.packages.find]
include = ["safari_tabs*"]

[tool.setuptools.package-data]
"safari_tabs.adapters" = ["windows.js"]
